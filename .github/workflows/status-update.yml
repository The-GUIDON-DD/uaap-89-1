name: Status update changes
on:
  schedule:
    - cron: "0 6 * * 3,6"
      timezone: "Asia/Manila"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send TG Reminder
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_NOTIFY_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TG_THREAD_ID }}
          format: markdown
          message: |
            *[STATUS UPDATE]*

            Hello @neil\_bsn @JJPardoes. Please update @bluezippolighter @julyannahuang with the following format by *8PM today*:
            1. Progress
            2. Blockers
            3. PR or Screenshots/Video for any progress you have
